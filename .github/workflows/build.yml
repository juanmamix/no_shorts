name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # para crear el Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Restaurar keystore desde secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64"; exit 1
          fi
          # Tolerante a saltos de línea, espacios o la etiqueta pegados por error.
          printf '%s' "$KEYSTORE_BASE64" | sed 's/KEYSTORE_BASE64//g' | tr -d ' \r\n\t' > "$RUNNER_TEMP/ks.b64"
          if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/release.jks"; then
            echo "::error::KEYSTORE_BASE64 no es base64 válido ($(wc -c < "$RUNNER_TEMP/ks.b64") caracteres; se esperaban 5680)"; exit 1
          fi
          rm -f "$RUNNER_TEMP/ks.b64"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Verificar keystore y contraseña
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n')" -alias "$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n')" > /dev/null; then
            echo "::error::No se pudo abrir el keystore: revisá KEYSTORE_PASSWORD y KEY_ALIAS"; exit 1
          fi

      - name: Compilar APK release firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/yt-sin-shorts-${BUILD_NUMBER}.apk"

      - name: Verificar firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "out/yt-sin-shorts-${BUILD_NUMBER}.apk"

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${BUILD_NUMBER}" "out/yt-sin-shorts-${BUILD_NUMBER}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "YT sin Shorts · build ${BUILD_NUMBER}" \
            --notes "APK compilado de ${{ github.sha }}. Descargá el .apk desde el celular e instalalo." \
            --latest

      - name: Limpiar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
